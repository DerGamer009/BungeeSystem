name: BungeeSystem
version: '${project.version}'
main: me.dergamer09.bungeesystem.BungeeSystem
author: 'DerGamer09'
description: 'A BungeeCord plugin that provides various commands and features, including a report system with Discord webhook.'
commands:
  bungee:
    description: 'A blocked command with permission check.'
    usage: '/bungee'
  togglenotify:
    description: "Toggles all notifications"
    usage: "/togglenotify"
    aliases: [ tnotify ]
    permission: "bungeesystem.notify"
  teamchat:
    description: 'Sends a message only to team members'
    permission: "bungeesystem.teamchat.use"
    aliases: [ tc ]
    usage: "/teamchat"
  joinme:
    description: 'Broadcasts a message inviting players to join your server'
    permission: "bungeesystem.joinme.use"
    usage: "/joinme"
  play:
    description: "Connects the player to a specific server"
    usage: "/play <server name>"
    permission: "bungeesystem.play"
  ping:
    description: "Shows the player's current ping"
    usage: "/ping"
  serverlist:
    description: "Lists all servers in the network"
    usage: "/serverlist"
    permission: "bungeesystem.servers"
  vanish:
    description: "Toggles vanish mode for the player"
    usage: "/vanish"
    aliases: [ v ]
    permission: "bungeesystem.vanish"
  find:
    description: "Finds out which server a player is currently on"
    usage: "/find <player>"
  send:
    description: "Moves a player to a specific server"
    usage: "/send <player> <server>"
    permission: "bungeesystem.send"
  broadcast:
    description: "Sends a message to the entire network"
    usage: "/broadcast <message>"
    permission: "bungeesystem.broadcast"
  uptime:
    description: "Shows how long the server has been running"
    usage: "/uptime"
    permission: "bungeesystem.uptime"
  afk:
    description: "Marks a player as AFK"
    usage: "/afk"
    permission: "bungeesystem.afk"
  nick:
    description: "Changes your nickname"
    usage: "/nick <name>"
    permission: "bungeesystem.nick"
  realname:
    description: "Reveals a player's real username"
    usage: "/realname <nickname>"
    permission: "bungeesystem.realname"
  maintenance:
    description: "enabled/disable maintenance mode on your Server"
    usage: "/maintenance"
    permission: "bungeesystem.maintenance"
  msg:
    aliases: [ message, pm, tell ]
    description: "Send a private message to a player"
  reply:
    aliases: [ r ]
    description: "Reply to the last private message"
  ignore:
    description: "Blocks messages from a specific player"
    usage: "/ignore <player>"
    permission: "bungeesystem.ignore"
  onlinetime:
    aliases: [ otime ]
    description: "Shows how long a player has been online"
    usage: "/onlinetime [player]"
    permission: "bungeesystem.onlinetime"
  lobby:
    aliases: [ hub, l ]
    description: "Teleports the player to a random lobby server"
    usage: "/lobby"
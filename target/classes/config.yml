# Database configuration
mysql:
  host: "localhost"
  port: "3306"
  database: "your_database_name"
  username: "your_username"
  password: "your_password"
  useSSL: false
  autoReconnect: true
  connectionTimeout: 30000
  maxLifetime: 1800000
  maximumPoolSize: 10
  minimumIdle: 5

# API Configuration for Dashboard Integration
api:
  url: "http://api.devvoxel.net/"
  server-ip: "auto"  # Set to "auto" to auto-detect, or specify IP manually
  port: "auto"        # Set to "auto" to auto-detect, or specify port manually
  enabled: true       # Set to true to enable API features
  timeout: 5000       # milliseconds
  retry_attempts: 3
  server_id: ""       # Will be cached after successful connection

# Feature Configuration
features:
  # Player tracking and events
  player_events: true      # Send join/quit/switch events to API
  player_tracking: true    # Track player statistics and activity
  
  # Punishment system integration
  punishment_api: true     # Send all punishments to API
  punishment_checks: true  # Check bans/mutes on join/chat via API
  
  # Report system integration
  report_api: true         # Send reports to API
  report_listing: true     # Allow listing reports from API
  
  # Player information
  player_info: true        # Allow fetching player info from API
  player_history: true     # Allow fetching player history from API
  
  # Server statistics
  server_stats: true       # Send server statistics to API
  
  # Admin logging
  admin_logging: true      # Log admin actions to API
  general_logging: true    # Send general plugin logs to API
  
  # Real-time updates
  websocket_updates: false # Enable WebSocket for real-time updates (optional)
  polling_updates: true    # Enable polling for updates from API

lobbies:
  - Lobby1
  - Lobby2
  - Lobby3

prefix: "&8| &cBungeeSystem &7» "
language: "en" # Available: en, de
defaultMessageColor: "&7"
updateMessageColor: "&e"
successMessageColor: "&a"
errorMessageColor: "&c"

# Discord webhook configuration
webhookUrl: "https://your-discord-webhook-url.com" #ReportSystem
reportWebhookFormat: "New report #%id% against %player% by %reporter% on %server%: %reason%"

# Server MOTD configuration
motd:
  normal: "Welcome to the BungeeSystem Server!"
  maintenance: "&c\uD83D\uDEA7 Maintenance Mode - Server is currently under maintenance! \uD83D\uDEA7"

# Maintenance mode configuration
maintenance:
  enabled: false
  whitelist:
    - admin_uuid_here
    - mod_uuid_here

# Server restart command configuration
restart:
  enable_screen_command: true
  screen_command_prefix: "screen -S mc_%server% -p 0 -X stuff"
  restart_command: "stop\n"

# Chat configuration
chat:
  # Global chat format with placeholders:
  # %prefix%, %suffix%, %player%, %displayname%, %server%, %group%, %groupdisplay%, %message%
  format: "%prefix%&r %player% &7» %message%"
  global_prefix: "&6[G]"
  
  # Cooldown between global messages in seconds (0 to disable)
  cooldown: 3
  
  # Team chat channel colors
  channels:
    admin: "&4"
    support: "&6"
    dev: "&b"
    mod: "&2"
    team: "&e"

# Punishment system configuration
punishments:
  # Broadcast punishments to staff with this permission: bungeesystem.staff
  broadcast_to_staff: true
  
  # Enable IP bans (bans all players connecting from the same IP)
  enable_ip_bans: true
  
  # Auto-punishments based on warning count
  auto_punish_warnings: true
  warnings_to_mute: 3
  warnings_to_ban: 5
  
  # Default durations and reasons for auto-punishments
  auto_mute_reason_id: 2  # ID from the punishment_reasons table
  auto_mute_duration: 86400000  # 1 day in milliseconds
  auto_ban_reason_id: 1  # ID from the punishment_reasons table
  auto_ban_duration: 604800000  # 7 days in milliseconds
  
  # Report system settings
  report_cooldown_seconds: 60  # Cooldown between reports for the same player
  notify_reporter_on_handled: true  # Notify the reporter when their report is handled
  
  # Punishment cleanup settings (removes expired punishments)
  cleanup_interval_minutes: 5 